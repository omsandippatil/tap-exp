function getAllQuestions() {
  let all = [];
  Object.values(QUESTION_BANK).forEach(arr => all = all.concat(arr));
  return all;
}

function scoreCosineSimilarity(v1, v2) {
  let dot = 0, mag1 = 0, mag2 = 0;
  TRAIT_KEYS.forEach(k => {
    const a = v1[k] || 0, b = v2[k] || 0;
    dot += a * b; mag1 += a * a; mag2 += b * b;
  });
  if (!mag1 || !mag2) return 0;
  return dot / (Math.sqrt(mag1) * Math.sqrt(mag2));
}

function computeCareerScores() {
  const scores = {};
  const allCareers = Object.values(CAREERS).flat();
  const base = {};
  
  state.selectedCareers.forEach(c => { base[c] = 35; });
  
  allCareers.forEach(career => {
    if (!CAREER_PROFILES[career]) return;
    const sim = scoreCosineSimilarity(state.vector, CAREER_PROFILES[career]);
    const selBonus = state.selectedCareers.includes(career) ? 25 : 0;
    scores[career] = Math.round(sim * 65 + selBonus + (base[career] || 0));
  });
  
  const maxScore = Math.max(...Object.values(scores));
  Object.keys(scores).forEach(c => {
    scores[c] = Math.min(99, Math.round((scores[c] / maxScore) * 93 + 3));
  });
  
  return scores;
}

function updateVector(traits) {
  Object.entries(traits).forEach(([k, v]) => {
    if (state.vector.hasOwnProperty(k)) {
      state.vector[k] = Math.min(100, Math.max(0, state.vector[k] + v * 0.6));
    }
  });
}

function getNextQuestion() {
  const usedIds = new Set(state.questionHistory);
  const allQ = getAllQuestions();
  const available = allQ.filter(q => !usedIds.has(q.id));
  
  if (!available.length) return null;
  
  const scores = computeCareerScores();
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const topCareer = sorted[0]?.[0];
  const topProfile = topCareer ? CAREER_PROFILES[topCareer] : null;
  
  let best = available[0];
  let bestInfoGain = -1;
  
  available.forEach(q => {
    let infoGain = 0;
    q.options.forEach(opt => {
      if (topProfile) {
        const relevantTraits = Object.keys(opt.traits).filter(t => topProfile[t] !== undefined);
        relevantTraits.forEach(t => {
          const profileVal = topProfile[t] || 50;
          const currentVal = state.vector[t] || 50;
          const uncertainty = Math.abs(50 - currentVal);
          const relevance = Math.abs(profileVal - 50);
          infoGain += (relevance / 100) * (1 - uncertainty / 50);
        });
      } else {
        infoGain += Object.keys(opt.traits).length;
      }
    });
    
    if (infoGain > bestInfoGain) { bestInfoGain = infoGain; best = q; }
  });
  
  return best;
}

function getTopResults() {
  const scores = computeCareerScores();
  return Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,3);
}

}

function toggleCareer(career) {
  const idx = state.selectedCareers.indexOf(career);
  if (idx > -1) {
    state.selectedCareers.splice(idx, 1);
  } else if (state.selectedCareers.length < 3) {
    state.selectedCareers.push(career);
    
    if (CAREER_PROFILES[career]) {
      const profile = CAREER_PROFILES[career];
      TRAIT_KEYS.forEach(k => {
        if (profile[k] > 70) state.vector[k] = Math.min(100, state.vector[k] + 5);
      });
    }
  }
  renderCareerPicker();
}

function goToQuestions() {
  if (state.selectedCareers.length !== 3) return;
  state.screen = "questions";
  state.questionIndex = 0;
  loadNextQuestion();
}

function loadNextQuestion() {
  if (state.questionIndex >= state.totalQuestions) {
    renderResults();
    return;
  }
  
  const q = getNextQuestion();
  if (!q) { renderResults(); return; }
  
  state.currentQuestion = q;
  state.questionHistory.push(q.id);
  state.selectedOption = null;
  renderQuestion(q);
}

function renderQuestion(q) {
  const progress = Math.round((state.questionIndex / state.totalQuestions) * 100);
  const qNum = state.questionIndex + 1;
  
  const optionsHtml = q.options.map((opt, i) => `
    <button onclick="selectOption(${i})" id="opt_${i}" class="option-btn w-full text-left p-4 rounded-2xl flex items-start gap-3 mb-3">
      <span class="text-2xl flex-shrink-0 mt-0.5">${opt.icon}</span>
      <span class="text-sm font-500 leading-relaxed" style="color:#111827">${opt.text}</span>
    </button>
  `).join('');

  render(`
    <div class="py-8">
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-700 text-white" style="background:#20B2AA">${qNum}</div>
          <span class="text-xs font-500" style="color:#6B7280">of ${state.totalQuestions}</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-24 h-1.5 rounded-full" style="background:#F3F4F6">
            <div class="progress-bar h-full rounded-full" style="width:${progress}%;background:#20B2AA"></div>
          </div>
          <span class="text-xs font-500" style="color:#6B7280">${progress}%</span>
        </div>
      </div>
      
      <div class="mb-8">
        <h2 class="text-xl font-700 leading-snug mb-2" style="color:#111827">${q.text}</h2>
        <p class="text-xs" style="color:#9CA3AF">Choose what feels most true to you</p>
      </div>
      
      <div>${optionsHtml}</div>
      
      <button id="continueBtn" onclick="submitAnswer()" disabled class="btn-primary w-full py-4 rounded-2xl text-base font-600 mt-4">
        Continue →
      </button>
      
      <p class="text-center text-xs mt-4" style="color:#9CA3AF">No right or wrong answers · Just be honest</p>
    </div>
  `);
}

function selectOption(idx) {
  state.selectedOption = idx;
  document.querySelectorAll('[id^="opt_"]').forEach(el => el.classList.remove('selected'));
  document.getElementById(`opt_${idx}`)?.classList.add('selected');
  const btn = document.getElementById('continueBtn');
  if (btn) btn.removeAttribute('disabled');
}

function submitAnswer() {
  if (state.selectedOption === null) return;
  
  const q = state.currentQuestion;
  const chosen = q.options[state.selectedOption];
  
  state.answers.push({ question: q.text, answer: chosen.text, traits: chosen.traits });
  updateVector(chosen.traits);
  
  state.questionIndex++;
  
  if (state.questionIndex >= state.totalQuestions) {
    showThinkingScreen();
  } else {
    loadNextQuestion();
  }
}

function showThinkingScreen() {
  render(`
    <div class="min-h-screen flex flex-col items-center justify-center py-16 text-center">
      <div class="mb-8">
        <div class="text-5xl mb-6">🔮</div>
        <h2 class="text-xl font-700 mb-3" style="color:#111827">Analysing your answers...</h2>
        <p class="text-sm" style="color:#6B7280">Finding the careers that fit who you really are</p>
      </div>
      <div class="flex gap-2 justify-center mb-8">
        <div class="thinking-dot w-3 h-3 rounded-full" style="background:#FFD54F"></div>
        <div class="thinking-dot w-3 h-3 rounded-full" style="background:#20B2AA"></div>
        <div class="thinking-dot w-3 h-3 rounded-full" style="background:#FFD54F"></div>
      </div>
      <p class="text-xs" style="color:#9CA3AF">This takes just a moment ✨</p>
    </div>
  `);
  
  setTimeout(() => renderResults(), 2200);
}

function renderResults() {
  const scores = computeCareerScores();
  const top3 = Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,3);
  const [topCareer, topScore] = top3[0];
  const traits = getPersonalityInsights();
  const warmMsg = getWarmMessage(topCareer, traits);
  
  const rankColors = ["#20B2AA","#FFD54F","#E5E7EB"];
  const rankLabels = ["Top Match","Second","Third"];
  
  const resultsHtml = top3.map(([career, score], i) => `
    <div class="p-4 rounded-2xl mb-3 ${i===0?'border-2':'border'}" style="background:#fff;border-color:${i===0?'#20B2AA':'#E5E7EB'}">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-2xl">${CAREER_ICONS[career]||'⭐'}</span>
          <div>
            <p class="text-sm font-700" style="color:#111827">${career}</p>
            <p class="text-xs font-500" style="color:${rankColors[i]}">${rankLabels[i]}</p>
          </div>
        </div>
        <span class="text-xl font-700" style="color:${i===0?'#20B2AA':'#6B7280'}">${score}%</span>
      </div>
      <div class="result-bar">
        <div class="result-bar-fill" id="bar_${i}" style="width:0%;background:${rankColors[i]}"></div>
      </div>
    </div>
  `).join('');
  
  const traitsHtml = traits.map(t => `
    <div class="flex items-start gap-3 p-3 rounded-xl" style="background:#fff;border:1px solid #F3F4F6">
      <span class="text-lg">${t.icon}</span>
      <div>
        <p class="text-sm font-600" style="color:#111827">${t.label}</p>
        <p class="text-xs" style="color:#6B7280">${t.desc}</p>
      </div>
    </div>
  `).join('');

  render(`
    <div class="py-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-600 mb-5" style="background:#FFF9C4;color:#856404;border:1px solid #FFD54F">
          ✦ Your Discovery is Ready
        </div>
        <h2 class="text-2xl font-700 mb-1" style="color:#111827">Your Career Matches</h2>
        <p class="text-sm" style="color:#6B7280">Based on 15 questions and your personality</p>
      </div>
      
      <div class="mb-8">${resultsHtml}</div>
      
      <div class="rounded-2xl p-5 mb-8" style="background:#FFF9C4;border:1px solid #FFD54F">
        <p class="text-xs font-600 uppercase tracking-widest mb-2" style="color:#856404">A message for you</p>
        <p class="text-sm leading-relaxed font-400" style="color:#1A1A1A">${warmMsg}</p>
      </div>
      
      <div class="mb-8">
        <p class="text-xs font-600 uppercase tracking-widest mb-4" style="color:#9CA3AF">Your Personality Strengths</p>
        <div class="space-y-2">${traitsHtml}</div>
      </div>
      
      <div class="p-4 rounded-2xl mb-8" style="background:#F0FDFA;border:1px solid #99F6E4">
        <p class="text-xs font-600 mb-2" style="color:#0D9488">🎯 What this means</p>
        <p class="text-xs leading-relaxed" style="color:#134E4A">
          Your chosen careers and answers together paint a clear picture. A high match doesn't mean that's the only path — it means your personality is naturally wired for it. Many great careers can work for you, but these three align most with how you think, feel, and act.
        </p>
      </div>
      
      <button onclick="restartApp()" class="btn-primary w-full py-4 rounded-2xl text-base font-600 mb-3">
        Discover Again →
      </button>
      <p class="text-center text-xs" style="color:#9CA3AF">Citizenship Academy · By The Apprentice Project</p>
    </div>
  `);
  
  setTimeout(() => {
    top3.forEach(([career, score], i) => {
      const bar = document.getElementById(`bar_${i}`);
      if (bar) bar.style.width = score + '%';
    });
  }, 300);
}

function startApp() { state.screen = "picker"; renderCareerPicker(); }
function restartApp() {
  state = {
    screen:"welcome",selectedCareers:[],
    vector:{curiosity:50,creativity:50,leadership:50,empathy:50,riskTolerance:50,logic:50,helping:50,prestige:50,discipline:50,social:50,artistic:50,physical:50,analytical:50,innovation:50,structure:50},
    answers:[],questionHistory:[],questionIndex:0,totalQuestions:15,selectedOption:null,careerScores:{},thinking:false
  };
  renderWelcome();
}

renderWelcome();
</script>
</body>
</html>
