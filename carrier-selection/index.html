<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0F0F0F;--ink2:#3A3A3A;--ink3:#7A7A7A;--ink4:#BCBCBC;
  --bg:#FAFAF8;--card:#FFFFFF;--card2:#F5F5F2;
  --yellow:#F5C518;--yellow-light:#FFF8D6;--yellow-border:#F5C518;
  --teal:#1A9B8F;--teal-light:#E8FAF8;--teal-border:#A7EDE7;
  --radius:18px;--radius-sm:10px;--radius-pill:99px;
  --shadow:0 2px 16px rgba(0,0,0,0.06);--shadow-lg:0 8px 40px rgba(0,0,0,0.10);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0 0 60px}
#app{width:100%;max-width:480px;padding:0 20px}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
.hl{background:var(--yellow);padding:0 4px 1px;border-radius:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes barGrow{from{width:0}to{width:var(--target)}}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.fade-up{animation:fadeUp .38s cubic-bezier(.22,.68,0,1.2) forwards}
.fade-in{animation:fadeIn .3s ease forwards}

.screen{padding-top:40px}

.tag{display:inline-flex;align-items:center;gap:6px;background:var(--yellow-light);color:#7A5500;border:1.5px solid var(--yellow-border);border-radius:var(--radius-pill);padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:.03em}

h1{font-size:36px;font-weight:900;line-height:1.1;color:var(--ink);letter-spacing:-.02em}
h2{font-size:24px;font-weight:800;line-height:1.2;color:var(--ink);letter-spacing:-.02em}
h3{font-size:18px;font-weight:700;color:var(--ink)}
.body{font-size:14px;color:var(--ink2);line-height:1.6}
.caption{font-size:12px;color:var(--ink3);line-height:1.5}

.btn-primary{width:100%;padding:16px 24px;background:var(--ink);color:#fff;border-radius:var(--radius);font-size:15px;font-weight:700;letter-spacing:-.01em;transition:all .18s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{background:#222;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-primary:disabled{background:var(--ink4);cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{width:100%;padding:14px 24px;background:transparent;color:var(--ink);border:2px solid #E0E0E0;border-radius:var(--radius);font-size:14px;font-weight:600;transition:all .18s ease}
.btn-outline:hover{border-color:var(--ink);background:var(--card2)}

.card{background:var(--card);border-radius:var(--radius);border:1.5px solid #EBEBEB;padding:16px;box-shadow:var(--shadow)}

.feature-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid #F0F0EE}
.feature-row:last-child{border-bottom:none}
.feature-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

.progress-track{height:4px;background:#EBEBEB;border-radius:99px;overflow:hidden;flex:1}
.progress-fill{height:100%;border-radius:99px;background:var(--yellow);transition:width .6s cubic-bezier(.4,0,.2,1)}

.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.domain-card{background:var(--card);border:2px solid #EBEBEB;border-radius:var(--radius);padding:18px 14px;cursor:pointer;transition:all .18s ease;text-align:left;position:relative;overflow:hidden}
.domain-card:hover{border-color:var(--yellow);transform:translateY(-2px);box-shadow:var(--shadow)}
.domain-card.selected{border-color:var(--yellow);background:var(--yellow-light)}
.domain-card .d-icon{font-size:28px;margin-bottom:10px;display:block}
.domain-card .d-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.domain-card .d-count{font-size:11px;color:var(--ink3);margin-top:3px}
.domain-card .check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;opacity:0;transition:opacity .18s}
.domain-card.selected .check{opacity:1}

.career-grid{display:flex;flex-wrap:wrap;gap:8px}
.career-chip{background:var(--card);border:1.5px solid #E0E0E0;border-radius:var(--radius-pill);padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .18s ease;display:flex;align-items:center;gap:6px}
.career-chip:hover{border-color:var(--teal);background:var(--teal-light);color:var(--teal)}
.career-chip.picked{border-color:var(--teal);background:var(--teal-light);color:var(--teal);font-weight:700}

.qnum-badge{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink);flex-shrink:0}

.opt-btn{width:100%;text-align:left;background:var(--card);border:2px solid #EBEBEB;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:all .2s ease;cursor:pointer}
.opt-btn:hover{border-color:var(--yellow);background:var(--yellow-light);transform:translateY(-1px)}
.opt-btn.selected{border-color:var(--yellow);background:var(--yellow-light)}
.opt-btn .opt-icon{font-size:24px;flex-shrink:0;line-height:1}
.opt-btn .opt-text{font-size:14px;font-weight:500;color:var(--ink);line-height:1.5;padding-top:2px}

.result-medal{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.result-bar-track{height:6px;background:#F0F0EE;border-radius:99px;overflow:hidden;margin-top:6px}
.result-bar-fill{height:100%;border-radius:99px;transition:width 1.4s cubic-bezier(.4,0,.2,1)}

.trait-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F5F5F2}
.trait-row:last-child{border-bottom:none}

.dot-loader{display:flex;gap:8px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--yellow);animation:blink 1.3s infinite}
.dot:nth-child(2){animation-delay:.18s;background:var(--teal)}
.dot:nth-child(3){animation-delay:.36s}

.warm-box{background:var(--yellow-light);border:2px solid var(--yellow-border);border-radius:var(--radius);padding:20px}

.step-indicator{display:flex;align-items:center;gap:8px}
.step-dot{width:8px;height:8px;border-radius:50%;background:#E0E0E0;transition:all .3s}
.step-dot.active{background:var(--yellow);width:20px;border-radius:4px}
.step-dot.done{background:var(--teal)}

@media(max-width:380px){
  h1{font-size:30px}
  h2{font-size:20px}
  .domain-grid{grid-template-columns:1fr 1fr}
  .domain-card{padding:14px 10px}
}
</style>

function cosine(v1,v2){
  let dot=0,m1=0,m2=0;
  TRAIT_KEYS.forEach(k=>{
    const a=v1[k]||0,b=v2[k]||0;
    dot+=a*b;m1+=a*a;m2+=b*b;
  });
  if(!m1||!m2)return 0;
  return dot/(Math.sqrt(m1)*Math.sqrt(m2));
}

function computeScores(){
  const scores={};
  const pool = state.availableCareers.length ? state.availableCareers : Object.keys(CAREER_PROFILES);
  pool.forEach(career=>{
    if(!CAREER_PROFILES[career])return;
    const sim = cosine(state.vector, CAREER_PROFILES[career]);
    const selBonus = state.selectedCareers.includes(career) ? 30 : 0;
    scores[career] = sim * 65 + selBonus;
  });
  const maxS = Math.max(...Object.values(scores));
  Object.keys(scores).forEach(c=>{
    scores[c] = Math.min(99, Math.round((scores[c]/maxS)*93+3));
  });
  return scores;
}

function updateVector(traits){
  Object.entries(traits).forEach(([k,v])=>{
    if(state.vector.hasOwnProperty(k)){
      state.vector[k] = Math.min(100,Math.max(0,state.vector[k]+v*0.55));
    }
  });
}

function getNextQuestion(){
  const used = new Set(state.questionHistory);
  const available = QUESTION_BANK.filter(q=>!used.has(q.id));
  if(!available.length)return null;

  const scores = computeScores();
  const topCareer = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const topProfile = topCareer ? CAREER_PROFILES[topCareer] : null;

  let best = available[0];
  let bestGain = -1;

  available.forEach(q=>{
    let gain = 0;
    q.options.forEach(opt=>{
      Object.entries(opt.traits).forEach(([t,w])=>{
        if(topProfile && topProfile[t]!==undefined){
          const relevance = Math.abs((topProfile[t]||50)-50)/50;
          const uncertainty = 1 - Math.abs((state.vector[t]||50)-50)/50;
          gain += relevance * uncertainty * w;
        } else {
          gain += w;
        }
      });
    });
    if(gain>bestGain){bestGain=gain;best=q;}
  });
  return best;
}

  state.selectedOption=null;
  renderQuestion(q);

  state.answers.push({question:q.text,answer:chosen.text,traits:chosen.traits});

    <div class="screen" style="padding-bottom:60px">
      <div class="fade-up" style="text-align:center;margin-bottom:32px">
        <div class="tag" style="margin-bottom:16px">✦ Your Discovery</div>
        <h2 style="margin-bottom:6px">Your top career<br><span class="hl">matches</span></h2>
        <p class="caption">Based on your choices + ${state.totalQuestions} personalised questions</p>
      </div>

      <div class="fade-up" style="margin-bottom:8px;animation-delay:.05s">${resultsHtml}</div>

      <div class="warm-box fade-up" style="margin-bottom:24px;animation-delay:.18s">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7A5500;margin-bottom:10px">A message for you</div>
        <p class="body" style="color:#1A1A1A;line-height:1.7">${warmMsg}</p>
      </div>

      <div class="card fade-up" style="margin-bottom:20px;animation-delay:.22s">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:14px">Your Personality Strengths</div>
        ${traitsHtml}
      </div>

      <div class="card fade-up" style="margin-bottom:20px;animation-delay:.26s">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:12px">Careers you picked</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${selectedHtml}</div>
      </div>

      <div style="background:var(--teal-light);border:1.5px solid var(--teal-border);border-radius:var(--radius);padding:16px;margin-bottom:28px" class="fade-up" style="animation-delay:.3s">
        <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:6px">💡 What this actually means</div>
        <p class="caption" style="color:#134E4A;line-height:1.6">A high match doesn't mean it's your only path — it means your personality is naturally wired for it. Your chosen careers influenced the result too, because your aspirations matter as much as your traits.</p>
      </div>

      <div class="fade-up" style="animation-delay:.34s">
        <button class="btn-primary" onclick="restartApp()" style="margin-bottom:12px">Try again →</button>
        <p class="caption" style="text-align:center">Citizenship Academy · By The Apprentice Project</p>
      </div>
    </div>
  `);

  setTimeout(()=>{
    top3.forEach(([career,score],i)=>{
      const bar=document.getElementById(`bar${i}`);
      if(bar)bar.style.width=score+'%';
    });
  },350);
}

function restartApp(){
  state={
    screen:"welcome",selectedDomains:[],selectedCareers:[],availableCareers:[],
    vector:{curiosity:50,creativity:50,leadership:50,empathy:50,risk:50,logic:50,helping:50,prestige:50,discipline:50,social:50,artistic:50,physical:50,analytical:50,innovation:50,structure:50},
    answers:[],questionHistory:[],questionIndex:0,totalQuestions:12,currentQuestion:null,selectedOption:null
  };
  renderWelcome();
}

renderWelcome();
</script>
</body>
</html>
