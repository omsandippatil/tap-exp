<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#20B2AA;
  --teal-light:#E6F7F6;
  --yellow:#FFD54F;
  --yellow-light:#FFFBEA;
  --bg:#FAFAFA;
  --card:#FFFFFF;
  --text:#111827;
  --sub:#6B7280;
  --border:#E5E7EB;
  --radius:16px;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:20px 16px 60px;
}
.topbar{
  width:100%;
  max-width:700px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 0 28px;
}
.logo{font-size:14px;font-weight:600;color:var(--teal);letter-spacing:.5px}
.logo span{color:var(--sub);font-weight:400}
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress-bar{
  width:80px;height:4px;
  background:var(--border);
  border-radius:99px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--teal);
  border-radius:99px;
  transition:width .4s ease;
}
.progress-label{font-size:12px;color:var(--sub);font-weight:500}

.card{
  width:100%;
  max-width:700px;
  background:var(--card);
  border-radius:24px;
  padding:40px 36px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 24px rgba(0,0,0,.05);
  animation:fadeUp .35s ease both;
}
@media(max-width:480px){
  .card{padding:28px 20px}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.step-tag{
  display:inline-block;
  font-size:11px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;
  color:var(--teal);
  background:var(--teal-light);
  padding:4px 10px;border-radius:99px;
  margin-bottom:20px;
}

.question-title{
  font-size:clamp(20px,4vw,26px);
  font-weight:700;
  line-height:1.35;
  color:var(--text);
  margin-bottom:10px;
}
.question-sub{
  font-size:15px;
  color:var(--sub);
  line-height:1.6;
  margin-bottom:32px;
}

.options{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.option{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  border:2px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all .18s ease;
  background:var(--card);
  text-align:left;
  width:100%;
  position:relative;
  overflow:hidden;
}
.option::before{
  content:'';
  position:absolute;inset:0;
  background:var(--yellow);
  opacity:0;
  transition:opacity .18s ease;
  z-index:0;
}
.option:hover::before{opacity:.07}
.option.selected{
  border-color:var(--yellow);
  background:var(--yellow-light);
}
.option.selected::before{opacity:0}
.option-letter{
  width:32px;height:32px;min-width:32px;
  border-radius:50%;
  background:var(--bg);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--sub);
  transition:all .18s;
  position:relative;z-index:1;
}
.option.selected .option-letter{
  background:var(--yellow);
  border-color:var(--yellow);
  color:#5A4000;
}
.option-text{
  font-size:15px;
  font-weight:500;
  color:var(--text);
  line-height:1.45;
  position:relative;z-index:1;
}

.btn{
  width:100%;
  padding:16px 24px;
  border:none;
  border-radius:var(--radius);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
}
.btn-primary{
  background:var(--teal);
  color:#fff;
}
.btn-primary:hover{background:#179e97;transform:translateY(-1px)}
.btn-primary:disabled{background:var(--border);color:var(--sub);cursor:not-allowed;transform:none}

.aspirations-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:10px;
  margin-bottom:28px;
}
.asp-chip{
  padding:12px 14px;
  border:2px solid var(--border);
  border-radius:12px;
  font-size:14px;font-weight:500;
  cursor:pointer;
  transition:all .18s;
  text-align:center;
  background:var(--card);
  color:var(--text);
  position:relative;
}
.asp-chip:hover{border-color:#c0c0c0}
.asp-chip.selected{
  border-color:var(--yellow);
  background:var(--yellow-light);
  color:#5A4000;
}
.asp-chip.disabled:not(.selected){
  opacity:.4;cursor:not-allowed;
}

.cat-label{
  font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--sub);
  margin:22px 0 10px;
}

.selected-count{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;color:var(--sub);
  margin-bottom:20px;
}
.count-pill{
  background:var(--yellow);
  color:#5A4000;
  padding:2px 8px;border-radius:99px;
  font-size:12px;font-weight:700;
}

.results-section{animation:fadeUp .4s ease both}
.match-card{
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:22px 24px;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.match-card.top{border-color:var(--yellow);background:var(--yellow-light)}
.match-rank{
  font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--sub);
  margin-bottom:6px;
}
.match-card.top .match-rank{color:#7a5500}
.match-name{
  font-size:22px;font-weight:700;color:var(--text);
  margin-bottom:10px;
}
.match-bar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.match-bar{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.match-fill{height:100%;border-radius:99px;background:var(--teal);transition:width 1s ease}
.match-card.top .match-fill{background:var(--yellow)}
.match-pct{font-size:15px;font-weight:700;color:var(--teal)}
.match-card.top .match-pct{color:#7a5500}

.insight-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
@media(max-width:480px){.insight-grid{grid-template-columns:1fr}}
.insight-item{
  background:var(--bg);
  border-radius:12px;
  padding:14px 16px;
}
.insight-label{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.insight-val{font-size:14px;font-weight:500;color:var(--text)}

.warm-msg{
  background:var(--yellow-light);
  border:2px solid var(--yellow);
  border-radius:var(--radius);
  padding:22px 24px;
  margin-bottom:20px;
}
.warm-msg-title{font-size:16px;font-weight:700;color:#7a5500;margin-bottom:8px}
.warm-msg-body{font-size:15px;color:#5a4000;line-height:1.65}

.trait-bar-list{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.trait-row{display:flex;flex-direction:column;gap:4px}
.trait-top{display:flex;justify-content:space-between;align-items:center}
.trait-name{font-size:13px;font-weight:500;color:var(--text)}
.trait-pct-label{font-size:12px;font-weight:600;color:var(--sub)}
.trait-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.trait-fill{height:100%;background:var(--teal);border-radius:99px;transition:width 1.2s ease}

.divider{height:1px;background:var(--border);margin:28px 0}
.section-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:16px}

.confidence-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:99px;
  font-size:13px;font-weight:600;
}
.conf-high{background:#E6F7F6;color:var(--teal)}
.conf-medium{background:#FFF8E1;color:#B45309}
.conf-low{background:#FEF2F2;color:#DC2626}

.restart-btn{
  width:100%;margin-top:8px;
  padding:14px;border-radius:var(--radius);
  border:2px solid var(--border);
  background:transparent;
  font-family:inherit;font-size:14px;font-weight:600;
  color:var(--sub);cursor:pointer;
  transition:all .18s;
}
.restart-btn:hover{border-color:var(--teal);color:var(--teal)}

.intro-hero{text-align:center;padding:10px 0 30px}
.intro-hero h1{font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.25;margin-bottom:14px}
.intro-hero h1 span{color:var(--teal)}
.intro-hero p{font-size:16px;color:var(--sub);line-height:1.65;max-width:480px;margin:0 auto 28px}
.intro-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--yellow-light);border:1.5px solid var(--yellow);
  padding:7px 16px;border-radius:99px;
  font-size:13px;font-weight:600;color:#7a5500;
  margin-bottom:28px;
}
</style>
</head>

];

function applyTraits(traits){
  for(const[k,v] of Object.entries(traits)){
    if(state.vectors[k] !== undefined){
      state.vectors[k] = Math.min(100,Math.max(0,state.vectors[k]+v));
    }
  }
}

function scoreCareer(profile){
  const keys = Object.keys(profile);
  let total=0,score=0;
  for(const k of keys){
    const w = profile[k]/100;
    const v = (state.vectors[k]||50)/100;
    score += w*v;
    total += w;
  }
  return total>0 ? Math.round((score/total)*100) : 50;
}

function getTopCareers(){
  const scores = Object.entries(careers).map(([name,profile])=>{
    return {name, score:scoreCareer(profile)};
  });
  scores.sort((a,b)=>b.score-a.score);
  const top = scores.slice(0,3);
  const norm = top[0].score;
  return top.map(c=>({...c, pct:Math.round(85 + (c.score/norm)*14)}));
}

function getInsights(){
  const v = state.vectors;
  const traits = Object.entries(v).sort((a,b)=>b[1]-a[1]).slice(0,6);
  
  let workStyle = v.independence>65 ? 'Independent deep work' : v.social>65 ? 'Collaborative team work' : 'Balanced — solo & team';
  let learnStyle = v.curiosity>70 ? 'Self-driven research' : v.discipline>70 ? 'Structured practice' : 'Hands-on experimentation';
  let decisionStyle = v.analytical>70 ? 'Data and logic first' : v.risk>70 ? 'Bold and intuitive' : 'Thoughtful and deliberate';
  let motivation = v.helping>70 ? 'Making a difference' : v.prestige>70 ? 'Building a legacy' : v.entrepreneurial>70 ? 'Creating something new' : 'Mastering a craft';
  let energy = v.social>65 ? 'Energised by people' : 'Energised by solitude';
  let strength = traits[0][0].charAt(0).toUpperCase()+traits[0][0].slice(1);

  return {workStyle,learnStyle,decisionStyle,motivation,energy,strength,traits};
}

function getConfidence(){
  const a = state.answers;
  if(a.length<8) return 'medium';
  const traitSets = a.map(ans=>ans.traits);
  let consistency = 0;
  for(let i=0;i<traitSets.length-1;i++){
    const k1 = Object.keys(traitSets[i]);
    const k2 = Object.keys(traitSets[i+1]);
    const overlap = k1.filter(k=>k2.includes(k)).length;
    consistency += overlap/(Math.max(k1.length,k2.length));
  }
  const avg = consistency/(traitSets.length-1);
  if(avg>0.5) return 'high';
  if(avg>0.3) return 'medium';
  return 'low';
}

function getWarmMessage(topCareer, insights){
  const name = topCareer.name;

  const work = insights.workStyle;

  const msgs = {
    default:`You've done something many people never do — you stopped and honestly asked yourself who you really are. That takes courage. Your answers reveal someone with a clear inner drive and a real sense of purpose. The path ahead won't always be easy, but the fact that you know what matters to you is already your biggest advantage. Keep going — your best chapter hasn't been written yet.`,
    'AI Engineer':`You think in systems. You love understanding how things work at a deep level, and you're not satisfied with surface answers. That relentless curiosity and love for logic is exactly what the world of AI and data needs right now. You have the rare combination of analytical precision and creative thinking. Wherever you go — the problems you'll solve will matter.`,
    'Entrepreneur':`You don't just want to succeed — you want to build. You see opportunities where others see obstacles, and you're willing to take real risks to make things happen. That spirit is rare and powerful. The road of entrepreneurship is hard, but people like you don't just adapt to the world — they change it. Start small, think big, and never stop.`,
    'Doctor':`You feel things deeply. When someone is suffering, you don't look away — you want to help. That's not a skill you can teach. Combined with your discipline and desire to understand the human body and mind, you have the heart of a healer. Medicine is one of the hardest paths, but the most meaningful. People will trust you with their lives — and you'll be worthy of that trust.`,
    'Teacher':`You have a gift that not everyone sees in themselves — the ability to make others feel understood and capable. Teaching is not just a profession for you; it's who you are. You light up when you help someone "get it." The impact you'll have on young minds will ripple for generations. That is not small — that is everything.`,
    'Designer':`You see the world differently. Where others see a product or a page, you see a feeling, an experience, a story. Your creativity isn't just talent — it's your way of thinking. Design is how you communicate and connect. In a world full of noise, your eye for beauty and meaning will make you unforgettable.`,
    'Lawyer':`You have a razor-sharp mind and a deep sense of what's right. You argue not to win — but because justice matters to you. The legal field needs people who are both analytically brilliant and morally grounded. You're both. Wherever you practice law, you'll be the kind of person people trust to stand in their corner when it really counts.`,
    'Scientist':`You were born asking "why." The world makes sense to you through evidence, curiosity, and patient inquiry. Research is not boring to you — it's thrilling. You're comfortable with uncertainty because you know that's where discovery lives. The questions you choose to chase may one day change what humanity knows about the universe.`,
    'Filmmaker':`You think in stories. You feel the world through images, music, and human truth. Filmmaking is not just a career for you — it's the most honest way you express who you are and what you believe. The camera is your language. And when you use it well, you can move people in ways that words alone never could.`,
    'Athlete':`You know what it feels like to push past the point where most people stop. That discipline, that fire, that need to test your limits — it defines you. Whether you compete at the highest level or inspire the next generation, your physical dedication and mental toughness will take you places most people only dream of.`,
  };

  return msgs[name] || msgs.default;
}

function render(){
  const card = document.getElementById('mainCard');
  if(state.phase==='intro') renderIntro(card);
  else if(state.phase==='aspirations') renderAspirations(card);
  else if(state.phase==='question') renderQuestion(card);
  else if(state.phase==='results') renderResults(card);
}

  document.getElementById('progressWrap').style.display='none';
  card.innerHTML=`

      <div class="intro-badge">✦ Free · Takes 5 minutes</div>

          <div style="width:26px;height:26px;min-width:26px;background:var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#5A4000">3</div>

    </div>

  `;
}

function startAspirations(){
  state.phase='aspirations';
  render();
}

function renderAspirations(card){
  document.getElementById('progressWrap').style.display='none';
  const sel = state.aspirations;
  const allCareers = Object.values(careerCategories).flat();
  const unique = [...new Set(allCareers)];

  let html = `
    <div class="step-tag">Step 1 of 2 · Dream Big</div>
    <div class="question-title">If nothing could stop you — who would you become?</div>
    <div class="question-sub">Pick exactly <strong>3 careers</strong> that feel exciting. Not what you're good at now — what sounds meaningful.</div>
    <div class="selected-count">Selected: <span class="count-pill" id="aspCount">${sel.length}</span> / 3</div>
  `;

  for(const [cat, careers2] of Object.entries(careerCategories)){
    html += `<div class="cat-label">${cat}</div><div class="aspirations-grid">`;
    for(const c of careers2){
      const isSel = sel.includes(c);
      const isDisabled = sel.length>=3 && !isSel;
      html += `<button class="asp-chip${isSel?' selected':''}${isDisabled?' disabled':''}" onclick="toggleAspiration('${c}')">${c}</button>`;
    }
    html += `</div>`;
  }

  html += `<div style="margin-top:28px"><button class="btn btn-primary" id="aspBtn" onclick="finaliseAspirations()" ${sel.length<3?'disabled':''}>Continue →</button></div>`;
  card.innerHTML = html;
}

function toggleAspiration(career){
  const i = state.aspirations.indexOf(career);
  if(i>-1){
    state.aspirations.splice(i,1);
  } else {
    if(state.aspirations.length>=3) return;
    state.aspirations.push(career);
  }
  state.aspirations.forEach(asp=>{
    const profile = careers[asp];
    if(profile){
      for(const[k,v] of Object.entries(profile)){
        if(state.vectors[k]!==undefined) state.vectors[k] = Math.min(100,state.vectors[k]+(v*0.1));
      }
    }
  });
  renderAspirations(document.getElementById('mainCard'));
}

function finaliseAspirations(){
  state.phase='question';
  state.questionIndex=0;
  render();
}

function getQuestion(index){
  return questionBank[Math.min(index,questionBank.length-1)];
}

function renderQuestion(card){
  const pw = document.getElementById('progressWrap');
  pw.style.display='flex';
  const total = questionBank.length;
  const pct = Math.round((state.questionIndex/total)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=`${state.questionIndex} / ${total}`;

  const q = getQuestion(state.questionIndex);
  let html = `
    <div class="step-tag">${q.tag}</div>
    <div class="question-title">${q.title}</div>
    ${q.sub?`<div class="question-sub">${q.sub}</div>`:''}
    <div class="options" id="optionsList">
  `;
  const letters = ['A','B','C'];
  q.options.forEach((opt,i)=>{
    html+=`
      <button class="option" onclick="selectOption(${i})" id="opt_${i}">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${opt.text}</div>
      </button>
    `;
  });
  html+=`</div>`;
  html+=`<button class="btn btn-primary" id="continueBtn" onclick="nextQuestion()" disabled>Continue →</button>`;
  card.innerHTML=html;
  state._selectedOption=null;
}

function selectOption(idx){
  state._selectedOption=idx;
  document.querySelectorAll('.option').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
  });
  document.getElementById('continueBtn').disabled=false;
}

function nextQuestion(){
  if(state._selectedOption===null) return;
  const q = getQuestion(state.questionIndex);
  const chosen = q.options[state._selectedOption];
  applyTraits(chosen.traits);
  state.answers.push({qid:q.id, optionIndex:state._selectedOption, traits:chosen.traits});
  state.questionIndex++;
  if(state.questionIndex>=questionBank.length){
    state.phase='results';
  }
  render();
}

function renderResults(card){
  const pw = document.getElementById('progressWrap');
  pw.style.display='flex';
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('progressLabel').textContent='Done!';

  const top = getTopCareers();
  const insights = getInsights();
  const conf = getConfidence();
  const warm = getWarmMessage(top[0], insights);
  const confLabel = conf==='high'?'High Confidence':conf==='medium'?'Medium Confidence':'Building Confidence';
  const confClass = conf==='high'?'conf-high':conf==='medium'?'conf-medium':'conf-low';

  const rankLabels = ['🥇 Top Match','🥈 Second Match','🥉 Third Match'];
  const topTraits = insights.traits.slice(0,5);

  let matchHtml = '';
  top.forEach((c,i)=>{
    matchHtml+=`
      <div class="match-card${i===0?' top':''}">
        <div class="match-rank">${rankLabels[i]}</div>
        <div class="match-name">${c.name}</div>
        <div class="match-bar-wrap">
          <div class="match-bar"><div class="match-fill" style="width:0%" data-target="${c.pct}"></div></div>
          <div class="match-pct">${c.pct}%</div>
        </div>
      </div>
    `;
  });

  let traitHtml = '';
  topTraits.forEach(([k,v])=>{
    const label = k.charAt(0).toUpperCase()+k.slice(1);
    traitHtml+=`
      <div class="trait-row">
        <div class="trait-top">
          <div class="trait-name">${label}</div>
          <div class="trait-pct-label">${Math.round(v)}%</div>
        </div>
        <div class="trait-track"><div class="trait-fill" style="width:0%" data-target="${Math.round(v)}"></div></div>
      </div>
    `;
  });

  card.innerHTML=`
    <div class="results-section">
      <div class="step-tag">Your Results</div>
      <div class="question-title" style="margin-bottom:6px">Your Career Matches</div>
      <div class="question-sub" style="margin-bottom:24px">Based on 15 questions and 20 personality dimensions</div>

      ${matchHtml}

      <div class="divider"></div>

      <div class="warm-msg">
        <div class="warm-msg-title">✦ A personal message for you</div>
        <div class="warm-msg-body">${warm}</div>
      </div>

      <div class="divider"></div>

      <div class="section-title">Your Personality Profile</div>
      <div class="trait-bar-list">${traitHtml}</div>

      <div class="divider"></div>

      <div class="section-title">Student Insights</div>
      <div class="insight-grid">
        <div class="insight-item">
          <div class="insight-label">Work Style</div>
          <div class="insight-val">${insights.workStyle}</div>
        </div>
        <div class="insight-item">
          <div class="insight-label">Learning Style</div>
          <div class="insight-val">${insights.learnStyle}</div>
        </div>
        <div class="insight-item">
          <div class="insight-label">Decision Style</div>
          <div class="insight-val">${insights.decisionStyle}</div>
        </div>
        <div class="insight-item">
          <div class="insight-label">Core Motivation</div>
          <div class="insight-val">${insights.motivation}</div>
        </div>
        <div class="insight-item">
          <div class="insight-label">Social Energy</div>
          <div class="insight-val">${insights.energy}</div>
        </div>
        <div class="insight-item">
          <div class="insight-label">Top Strength</div>
          <div class="insight-val">${insights.strength}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
        <div class="section-title" style="margin-bottom:0">Result Confidence</div>
        <div class="confidence-badge ${confClass}">${confLabel}</div>
      </div>

      <button class="btn btn-primary" onclick="restart()">Try Again →</button>
      <button class="restart-btn" onclick="restart()">Start Fresh</button>
    </div>
  `;

  setTimeout(()=>{
    document.querySelectorAll('[data-target]').forEach(el=>{
      el.style.width = el.dataset.target + '%';
    });
  },100);
}

function restart(){
  state={
    phase:'intro',
    aspirations:[],
    questionIndex:0,
    answers:[],
    vectors:{...vectors},
  };
  document.getElementById('progressWrap').style.display='none';
  render();
}

render();
</script>
